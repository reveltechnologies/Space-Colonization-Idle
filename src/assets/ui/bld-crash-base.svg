<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" stroke-linejoin="round" stroke-linecap="round">
  <!-- Ground impact shadow & dusty crater rim -->
  <ellipse cx="50" cy="85" rx="42" ry="9" fill="#1b1147" opacity="0.32"/>
  <ellipse cx="50" cy="80" rx="39" ry="11" fill="#475569" stroke="#1b1147" stroke-width="4.5"/>
  <ellipse cx="48" cy="79" rx="28" ry="6.5" fill="#1e293b"/>

  <!-- Subtle rising smoke puffs -->
  <circle cx="29" cy="30" r="5" fill="#cbd5e1" stroke="#1b1147" stroke-width="3" opacity="0.88"/>
  <circle cx="35" cy="21" r="6.5" fill="#e2e8f0" stroke="#1b1147" stroke-width="3" opacity="0.72"/>

  <!-- Back tail wing & snapped right wing stub -->
  <polygon points="22,44 10,27 28,36" fill="#ff5a4d" stroke="#1b1147" stroke-width="4"/>
  <polygon points="56,52 72,44 76,51 60,59" fill="#94a3b8" stroke="#1b1147" stroke-width="3.5"/>

  <!-- Embossed crimson distress beacon at tail tip -->
  <circle cx="14" cy="28" r="4.5" fill="#ffc83a" stroke="#1b1147" stroke-width="3"/>
  <circle cx="14" cy="28" r="2.2" fill="#ff5a4d"/>

  <!-- Nose-down crashed escape plane fuselage -->
  <path d="M18 46 Q24 38 40 42 L78 58 Q87 63 83 71 Q76 78 64 74 L24 58 Q15 54 18 46 Z" fill="#f8fafc" stroke="#1b1147" stroke-width="4.5"/>
  <!-- Belly shadow & scorch plate -->
  <path d="M23 56 L66 73 Q77 77 83 70 Q79 79 65 76 L24 59 Z" fill="#94a3b8"/>
  <!-- Crimson racing stripe -->
  <path d="M25 46 L72 64 L68 69 L21 51 Z" fill="#ff5a4d" stroke="#1b1147" stroke-width="2.5"/>

  <!-- Cracked glowing cyan cockpit canopy -->
  <path d="M47 46 Q59 44 68 53 L62 60 L44 52 Z" fill="#38bdf8" stroke="#1b1147" stroke-width="3.5"/>
  <path d="M51 48 L57 52 L54 55" stroke="#ffffff" stroke-width="2.2" fill="none"/>
  <circle cx="62" cy="52" r="2" fill="#e0f7ff"/>

  <!-- Deployed left wing + improvised solar flap -->
  <polygon points="40,56 18,74 34,79 52,62" fill="#e2e8f0" stroke="#1b1147" stroke-width="4"/>
  <polygon points="24,69 36,61 45,65 32,75" fill="#2563eb" stroke="#1b1147" stroke-width="3"/>
  <path d="M29 68 L39 63 M34 72 L43 66" stroke="#93c5fd" stroke-width="1.8"/>

  <!-- Crater dirt mounds in foreground covering buried nosecone -->
  <path d="M62 79 Q71 67 84 74 Q90 80 82 85 L58 84 Z" fill="#64748b" stroke="#1b1147" stroke-width="4"/>
  <path d="M16 76 Q25 69 34 77 L28 84 L12 81 Z" fill="#64748b" stroke="#1b1147" stroke-width="3.5"/>
  <!-- Salvaged orange brick & emergency crate beside wreckage -->
  <rect x="44" y="75" width="12" height="8" rx="2" fill="#f59e0b" stroke="#1b1147" stroke-width="3"/>
</svg>
