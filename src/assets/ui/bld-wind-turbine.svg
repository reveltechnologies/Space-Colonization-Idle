  <rect x="42.5" y="50" width="15" height="5" rx="2" fill="#37a8ff" stroke="#1b1147" stroke-width="2.5"/>
  <rect x="41" y="66" width="18" height="5" rx="2" fill="#37a8ff" stroke="#1b1147" stroke-width="2.5"/>
  <path d="M39 83 L44 36 H56 L61 83 Z" fill="none" stroke="#1b1147" stroke-width="4.5"/>
  <!-- Sculpted 3-blade rotor with cyan & gold tips -->
  <g transform="rotate(14 50 36)">
    <g stroke="#1b1147" stroke-width="4.2">
      <path d="M44 34 Q40 16 50 4 Q60 16 56 34 Z" fill="#ffffff"/>
      <path d="M46.5 13 Q50 5 53.5 13 Z" fill="#ffc83a" stroke="none"/>
      <path d="M45 20 Q50 13 55 20" stroke="#37a8ff" stroke-width="3.5" fill="none"/>
      <path d="M44 34 Q40 16 50 4 Q60 16 56 34 Z" fill="none" stroke="#1b1147" stroke-width="4.2"/>
    </g>
    <g transform="rotate(120 50 36)">
      <path d="M44 34 Q40 16 50 4 Q60 16 56 34 Z" fill="#ffffff" stroke="#1b1147" stroke-width="4.2"/>
      <path d="M46.5 13 Q50 5 53.5 13 Z" fill="#ffc83a"/>
      <path d="M45 20 Q50 13 55 20" stroke="#37a8ff" stroke-width="3.5" fill="none"/>
      <path d="M44 34 Q40 16 50 4 Q60 16 56 34 Z" fill="none" stroke="#1b1147" stroke-width="4.2"/>
    </g>
    <g transform="rotate(240 50 36)">
      <path d="M44 34 Q40 16 50 4 Q60 16 56 34 Z" fill="#ffffff" stroke="#1b1147" stroke-width="4.2"/>
      <path d="M46.5 13 Q50 5 53.5 13 Z" fill="#ffc83a"/>
      <path d="M45 20 Q50 13 55 20" stroke="#37a8ff" stroke-width="3.5" fill="none"/>
      <path d="M44 34 Q40 16 50 4 Q60 16 56 34 Z" fill="none" stroke="#1b1147" stroke-width="4.2"/>
    </g>
