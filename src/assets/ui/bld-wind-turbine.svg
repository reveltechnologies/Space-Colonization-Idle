  <rect x="65" y="76" width="8" height="5" rx="1.5" fill="#37a8ff" stroke="#1b1147" stroke-width="2"/>
  <!-- Reinforced wide base deck -->
  <rect x="31" y="81" width="38" height="10" rx="3.5" fill="#8d7ab8" stroke="#1b1147" stroke-width="4"/>
