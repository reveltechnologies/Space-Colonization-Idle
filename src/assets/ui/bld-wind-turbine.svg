  <!-- Bold golden hub spinner cone -->
  <circle cx="50" cy="36" r="8.5" fill="#ffc83a" stroke="#1b1147" stroke-width="4.5"/>
  <circle cx="47.5" cy="33.5" r="2.4" fill="#fff6c4"/>
