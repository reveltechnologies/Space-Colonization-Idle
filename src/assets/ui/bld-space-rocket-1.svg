<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="50" cy="91" rx="42" ry="5.5" fill="#1b1147" opacity="0.28"/>
  <!-- Launchpad deck -->
  <rect x="14" y="80" width="72" height="10" rx="4" fill="#64748b" stroke="#1b1147" stroke-width="4.5"/>
  <!-- Steel umbilical service tower -->
  <path d="M22 80 V28 H32 V80 Z" fill="#94a3b8" stroke="#1b1147" stroke-width="4"/>
  <path d="M22 44 H42 M22 60 H42 M22 36 L32 44 M32 52 L22 60 M22 68 L32 76" stroke="#1b1147" stroke-width="3" fill="none"/>

  <!-- Golden thruster bell & warm exhaust glow -->
