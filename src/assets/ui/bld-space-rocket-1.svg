  <!-- Crimson delta fins -->
  <polygon points="40,56 27,76 41,73" fill="#ff5a4d" stroke="#1b1147" stroke-width="4"/>
  <polygon points="60,56 73,76 59,73" fill="#e03e31" stroke="#1b1147" stroke-width="4"/>

  <!-- Single-core white-and-crimson rocket fuselage -->
