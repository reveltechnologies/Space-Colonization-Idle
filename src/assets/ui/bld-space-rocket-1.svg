  <!-- Crimson nose cone & band -->
  <path d="M41.5 28 Q45 14 50 9 Q55 14 58.5 28 Z" fill="#ff5a4d" stroke="#1b1147" stroke-width="4"/>
  <rect x="40" y="61" width="20" height="7" fill="#ff5a4d" stroke="#1b1147" stroke-width="3.5"/>
  <!-- Highlight streak -->
  <path d="M44 33 V57" stroke="#ffffff" stroke-width="3.5"/>
  <!-- Porthole window -->
  <circle cx="50" cy="43" r="6" fill="#38bdf8" stroke="#1b1147" stroke-width="3.5"/>
  <circle cx="48.5" cy="41.5" r="2" fill="#e0f7ff"/>
</svg>
