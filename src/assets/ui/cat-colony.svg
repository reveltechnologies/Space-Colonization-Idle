  <rect x="16" y="34" width="9" height="16" rx="4" fill="#ffb13b" stroke="#1b1147" stroke-width="4.5"/>
  <rect x="75" y="34" width="9" height="16" rx="4" fill="#ffb13b" stroke="#1b1147" stroke-width="4.5"/>
  <circle cx="50" cy="42" r="29" fill="none" stroke="#1b1147" stroke-width="6"/>
  <!-- Curved cyan visor -->
  <rect x="29" y="28" width="42" height="26" rx="13" fill="#4cc9ff" stroke="#1b1147" stroke-width="5.5"/>
  <!-- Visor specular glint -->
  <ellipse cx="42" cy="36" rx="8" ry="3.5" transform="rotate(-18 42 36)" fill="#c9f6ff"/>
