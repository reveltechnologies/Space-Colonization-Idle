<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#060913" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Space Colonization: Idle — Mobile sci-fi incremental colony builder." />
  <title>Space Colonization: Idle</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Animated Space Background -->
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- Planet Carousel Stage -->
  <canvas id="planet-stage" aria-label="Planet Carousel"></canvas>

  <!-- Top-Left Colony Currencies HUD -->
  <header id="currency-hud" class="currency-hud" aria-label="Colony Currencies">
    <!-- Space Credits Card -->
    <div id="currency-credits" class="currency-card currency-card--credits">
      <svg class="hud-frame" viewBox="0 0 148 48" preserveAspectRatio="none" aria-hidden="true">
        <polygon class="hud-outline" points="1,1 137,1 147,11 147,47 11,47 1,37" vector-effect="non-scaling-stroke"></polygon>
        <line class="hud-rail" x1="2" y1="8" x2="2" y2="33" vector-effect="non-scaling-stroke"></line>
        <polyline class="hud-bracket" points="129,1 137,1 147,11 147,19" vector-effect="non-scaling-stroke"></polyline>
      </svg>

      <!-- Bespoke Code-Generated Space Credit Card SVG -->
      <svg class="currency-icon" width="32" height="32" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="sc-card-bg" x1="2" y1="6" x2="34" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#173063"></stop>
            <stop offset="55%" stop-color="#0d1d42"></stop>
            <stop offset="100%" stop-color="#071026"></stop>
          </linearGradient>
          <linearGradient id="sc-gold" x1="2" y1="6" x2="34" y2="30" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fef08a"></stop>
            <stop offset="48%" stop-color="#fbbf24"></stop>
            <stop offset="100%" stop-color="#d97706"></stop>
          </linearGradient>
          <linearGradient id="sc-chip" x1="5.5" y1="14.5" x2="12" y2="19.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fde68a"></stop>
            <stop offset="100%" stop-color="#f59e0b"></stop>
          </linearGradient>
          <linearGradient id="sc-sheen" x1="4" y1="6" x2="22" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24"></stop>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
          </linearGradient>
          <clipPath id="sc-card-clip">
            <rect x="2" y="6.5" width="32" height="23" rx="3.5"></rect>
          </clipPath>
        </defs>

        <!-- Card Body -->
        <rect x="2" y="6.5" width="32" height="23" rx="3.5" fill="url(#sc-card-bg)"></rect>

        <!-- Clipped Cosmic Artwork Inside Card -->
        <g clip-path="url(#sc-card-clip)">
          <!-- Diagonal Specular Sheen -->
          <polygon points="2,6.5 20,6.5 11,29.5 2,29.5" fill="url(#sc-sheen)"></polygon>
          <!-- Sweeping Orbital Ring -->
          <ellipse cx="18" cy="18" rx="19" ry="7.5" transform="rotate(-16 18 18)" stroke="#7dd3fc" stroke-opacity="0.38" stroke-width="1.2"></ellipse>
          <!-- Micro Planet & Stars -->
          <circle cx="28.5" cy="11.5" r="1.5" fill="#7dd3fc"></circle>
          <circle cx="8" cy="10.5" r="0.8" fill="#fef08a" opacity="0.9"></circle>
          <circle cx="15.5" cy="9.5" r="0.7" fill="#ffffff" opacity="0.85"></circle>
          <circle cx="10.5" cy="25" r="0.7" fill="#bae6fd" opacity="0.8"></circle>
        </g>

        <!-- Gold Metallic Border -->
        <rect x="2" y="6.5" width="32" height="23" rx="3.5" stroke="url(#sc-gold)" stroke-width="1.6"></rect>

        <!-- EMV Smart Chip -->
        <rect x="5.5" y="14.5" width="6.5" height="5" rx="1" fill="url(#sc-chip)"></rect>
        <line x1="7.7" y1="14.5" x2="7.7" y2="19.5" stroke="#92400e" stroke-width="0.6" opacity="0.65"></line>
        <line x1="9.8" y1="14.5" x2="9.8" y2="19.5" stroke="#92400e" stroke-width="0.6" opacity="0.65"></line>
        <line x1="5.5" y1="17" x2="12" y2="17" stroke="#92400e" stroke-width="0.6" opacity="0.65"></line>

        <!-- Embossed SC Monogram -->
        <text
          x="22.5"
          y="22.5"
          text-anchor="middle"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11.5"
          font-weight="900"
          letter-spacing="0.4"
          fill="url(#sc-gold)"
          stroke="#071026"
          stroke-width="0.6"
          paint-order="stroke"
        >SC</text>
      </svg>

      <div class="currency-meta">
        <span class="currency-label">CREDITS</span>
        <div class="currency-value-row">
          <span id="val-credits" class="currency-value">0</span>
          <span id="rate-credits" class="currency-rate"></span>
        </div>
      </div>
    </div>

    <!-- Space Ore Gem Card -->
    <div id="currency-ore" class="currency-card currency-card--ore">
      <svg class="hud-frame" viewBox="0 0 148 48" preserveAspectRatio="none" aria-hidden="true">
        <polygon class="hud-outline" points="1,1 137,1 147,11 147,47 11,47 1,37" vector-effect="non-scaling-stroke"></polygon>
        <line class="hud-rail" x1="2" y1="8" x2="2" y2="33" vector-effect="non-scaling-stroke"></line>
        <polyline class="hud-bracket" points="129,1 137,1 147,11 147,19" vector-effect="non-scaling-stroke"></polyline>
      </svg>

      <!-- Bespoke Code-Generated Space Ore Gem SVG -->
      <svg class="currency-icon" width="32" height="32" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <defs>
          <radialGradient id="ore-halo" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"></stop>
            <stop offset="60%" stop-color="#6366f1" stop-opacity="0.18"></stop>
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0"></stop>
          </radialGradient>
          <linearGradient id="ore-table" x1="12" y1="10" x2="24" y2="26" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#e0f2fe"></stop>
            <stop offset="45%" stop-color="#38bdf8"></stop>
            <stop offset="100%" stop-color="#818cf8"></stop>
          </linearGradient>
          <linearGradient id="ore-edge" x1="7" y1="3" x2="29" y2="33" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffffff"></stop>
            <stop offset="50%" stop-color="#67e8f9"></stop>
            <stop offset="100%" stop-color="#a78bfa"></stop>
          </linearGradient>
        </defs>

        <!-- Cosmic Crystal Glow -->
        <circle cx="18" cy="18" r="15" fill="url(#ore-halo)"></circle>

        <!-- Cut Facets (Outer Crown -> Inner Table) -->
        <!-- Upper-Left Highlight Facet -->
        <polygon points="7,11 18,3 18,9.5 12.5,13.5" fill="#a5f3fc"></polygon>
        <!-- Upper-Right Facet -->
        <polygon points="18,3 29,11 23.5,13.5 18,9.5" fill="#38bdf8"></polygon>
        <!-- Right Facet -->
        <polygon points="29,11 27,25 22.5,22 23.5,13.5" fill="#0284c7"></polygon>
        <!-- Lower-Right Deep Amethyst Shadow Facet -->
        <polygon points="27,25 18,33 18,26.5 22.5,22" fill="#3730a3"></polygon>
        <!-- Lower-Left Cobalt-Violet Facet -->
        <polygon points="18,33 9,25 13.5,22 18,26.5" fill="#4f46e5"></polygon>
        <!-- Left Azure Facet -->
        <polygon points="9,25 7,11 12.5,13.5 13.5,22" fill="#06b6d4"></polygon>

        <!-- Luminous Prism Center Table -->
        <polygon points="18,9.5 23.5,13.5 22.5,22 18,26.5 13.5,22 12.5,13.5" fill="url(#ore-table)" stroke="#e0f2fe" stroke-width="0.75"></polygon>

        <!-- Internal Ridge Lines -->
        <line x1="18" y1="3" x2="18" y2="9.5" stroke="#ffffff" stroke-width="0.7" opacity="0.85"></line>
        <line x1="7" y1="11" x2="12.5" y2="13.5" stroke="#ffffff" stroke-width="0.7" opacity="0.8"></line>
        <line x1="29" y1="11" x2="23.5" y2="13.5" stroke="#bae6fd" stroke-width="0.7" opacity="0.7"></line>
        <line x1="27" y1="25" x2="22.5" y2="22" stroke="#c4b5fd" stroke-width="0.6" opacity="0.55"></line>
        <line x1="18" y1="33" x2="18" y2="26.5" stroke="#c4b5fd" stroke-width="0.6" opacity="0.55"></line>
        <line x1="9" y1="25" x2="13.5" y2="22" stroke="#a5f3fc" stroke-width="0.65" opacity="0.65"></line>

        <!-- Crisp Crystal Perimeter -->
        <polygon points="18,3 29,11 27,25 18,33 9,25 7,11" stroke="url(#ore-edge)" stroke-width="1.25" stroke-linejoin="round"></polygon>

        <!-- 4-Point Sparkle & Floating Energy Flecks -->
        <path d="M11.5 6.2 L12.2 8.3 L14.3 9 L12.2 9.7 L11.5 11.8 L10.8 9.7 L8.7 9 L10.8 8.3 Z" fill="#ffffff"></path>
        <circle cx="5" cy="20" r="1.1" fill="#67e8f9" opacity="0.9"></circle>
        <circle cx="31.5" cy="16" r="1" fill="#c4b5fd" opacity="0.85"></circle>
      </svg>

      <div class="currency-meta">
        <span class="currency-label">SPACE ORE</span>
        <div class="currency-value-row">
          <span id="val-ore" class="currency-value">0</span>
          <span id="rate-ore" class="currency-rate"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- Edge-Docked Tactical Planet Navigation Wings -->
  <button id="btn-prev-planet" class="planet-nav planet-nav-prev is-hidden" type="button" aria-label="Previous Planet">
    <svg class="hud-frame" viewBox="0 0 52 92" preserveAspectRatio="none" aria-hidden="true">
      <polygon class="hud-outline" points="1,1 40,1 51,12 51,80 40,91 1,91" vector-effect="non-scaling-stroke"></polygon>
      <line class="hud-rail" x1="2" y1="15" x2="2" y2="77" vector-effect="non-scaling-stroke"></line>
    </svg>
    <svg class="nav-chevron" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
      <polyline points="14 5 7 12 14 19" stroke-width="3.2"></polyline>
      <polyline points="19 7.5 14.5 12 19 16.5" stroke-width="2.4" opacity="0.55"></polyline>
    </svg>
  </button>
  <button id="btn-next-planet" class="planet-nav planet-nav-next" type="button" aria-label="Next Planet">
    <svg class="hud-frame" viewBox="0 0 52 92" preserveAspectRatio="none" aria-hidden="true">
      <polygon class="hud-outline" points="12,1 51,1 51,91 12,91 1,80 1,12" vector-effect="non-scaling-stroke"></polygon>
      <line class="hud-rail" x1="50" y1="15" x2="50" y2="77" vector-effect="non-scaling-stroke"></line>
    </svg>
    <svg class="nav-chevron" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true">
      <polyline points="10 5 17 12 10 19" stroke-width="3.2"></polyline>
      <polyline points="5 7.5 9.5 12 5 16.5" stroke-width="2.4" opacity="0.55"></polyline>
    </svg>
  </button>

  <!-- Planet Position Indicator Dots -->
  <nav id="planet-dots" class="planet-dots" aria-label="Planet Selection">
    <button type="button" class="planet-dot active" data-index="0" aria-label="Planet 1" aria-current="true"></button>
    <button type="button" class="planet-dot" data-index="1" aria-label="Planet 2"></button>
    <button type="button" class="planet-dot" data-index="2" aria-label="Planet 3"></button>
  </nav>

  <!-- Bottom-Right Camera Command Deck -->
  <div id="view-controls" class="view-controls" aria-label="View Controls">
    <div class="zoom-console" role="group" aria-label="Zoom Controls">
      <svg class="hud-frame" viewBox="0 0 165 50" preserveAspectRatio="none" aria-hidden="true">
        <polygon class="hud-outline" points="11,1 164,1 164,39 154,49 1,49 1,11" vector-effect="non-scaling-stroke"></polygon>
        <polyline class="hud-bracket" points="1,19 1,11 11,1 19,1" vector-effect="non-scaling-stroke"></polyline>
        <polyline class="hud-bracket" points="146,49 154,49 164,39 164,31" vector-effect="non-scaling-stroke"></polyline>
      </svg>
      <button id="btn-zoom-out" class="zoom-seg-btn" type="button" aria-label="Zoom Out" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
      <span class="zoom-divider" aria-hidden="true"></span>
      <div class="zoom-readout" aria-live="off">
        <span id="zoom-level-label" class="zoom-value">1.0×</span>
        <span class="zoom-gauge" aria-hidden="true">
          <span id="zoom-gauge-fill" class="zoom-gauge-fill"></span>
        </span>
      </div>
      <span class="zoom-divider" aria-hidden="true"></span>
      <button id="btn-zoom-in" class="zoom-seg-btn" type="button" aria-label="Zoom In">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="square" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>
  </div>

  <script src="./js/main.js"></script>
  <script src="./js/currencies.js"></script>
  <script src="./js/planets.js"></script>
</body>
</html>
