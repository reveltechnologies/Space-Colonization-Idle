<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#060913" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Space Colonization: Idle — Mobile sci-fi incremental colony builder." data-i18n-content="app.description" />
  <title data-i18n="app.title">Space Colonization: Idle</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <canvas id="planet-stage" aria-label="Planet Carousel" data-i18n-aria-label="aria.planet_carousel"></canvas>

  <!-- Currencies -->
  <header id="currency-hud" class="currency-hud" aria-label="Colony Currencies" data-i18n-aria-label="aria.colony_currencies">
    <div id="currency-credits" class="currency-bar currency-bar--credits" title="Credits" data-i18n-title="currencies.credits">
      <img class="currency-badge" src="./assets/ui/icon-credits.svg" alt="" draggable="false" />
      <span id="val-credits" class="currency-value">500</span>
      <span id="rate-credits" class="currency-rate"></span>
    </div>
    <div id="currency-ore" class="currency-bar currency-bar--ore" title="Space Ore" data-i18n-title="currencies.space_ore">
      <img class="currency-badge" src="./assets/ui/icon-ore.svg" alt="" draggable="false" />
      <span id="val-ore" class="currency-value">100</span>
      <span id="rate-ore" class="currency-rate"></span>
    </div>
  </header>

  <!-- Planet Stats HUD (Top-Right Studio Deck) -->
  <aside id="planet-stats-hud" class="planet-stats-hud" aria-label="Current Planet Statistics" data-i18n-aria-label="aria.current_planet_stats">
    <div id="planet-stats-deck" class="planet-stats-deck" data-planet="0" data-planet-type="rocky">
      <div id="planet-hud-emblem" class="planet-hud-emblem" title="Planet 1" data-i18n-title="planets.planet_1.default_name">
        <img id="planet-hud-icon" class="planet-hud-icon" src="./assets/ui/planet-rocky.svg" alt="" draggable="false" />
      </div>

      <div class="planet-deck-body">
        <div id="planet-deck-header" class="planet-deck-header">
          <button
            id="btn-rename-planet"
            class="planet-rename-btn"
            type="button"
            aria-label="Rename Planet"
            title="Rename Planet"
            data-i18n-aria-label="planet.rename"
            data-i18n-title="planet.rename"
          >
            <img class="planet-rename-icon" src="./assets/ui/icon-edit.svg" alt="" draggable="false" />
            <span class="planet-rename-check" aria-hidden="true">✓</span>
          </button>
          <span id="planet-hud-name" class="planet-hud-name" data-i18n="planets.planet_1.default_name">Planet 1</span>
          <input
            id="planet-hud-name-input"
            class="planet-name-input"
            type="text"
            maxlength="12"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Planet Name"
            placeholder="Planet name"
            data-i18n-aria-label="planet.name_label"
            data-i18n-placeholder="planet.name_placeholder"
          />
        </div>

        <div class="planet-deck-tray">
          <div id="planet-stat-citizens" class="planet-stat-cell planet-stat-cell--citizens is-empty" title="Citizens on this planet (Current / Max Capacity)" data-i18n-title="planet.citizens_tooltip">
            <img class="planet-stat-icon" src="./assets/ui/icon-citizen.svg" alt="" draggable="false" />
            <div class="planet-stat-info">
              <span class="planet-stat-value">
                <span id="val-citizens-curr" class="planet-stat-curr">0</span><span class="planet-stat-sep">/</span><span id="val-citizens-max" class="planet-stat-max">0</span>
              </span>
              <span class="planet-stat-meter" aria-hidden="true">
                <span id="meter-citizens-fill" class="planet-stat-meter-fill"></span>
              </span>
            </div>
          </div>

          <span class="planet-tray-divider" aria-hidden="true"></span>

          <div id="planet-stat-energy" class="planet-stat-cell planet-stat-cell--energy is-empty" title="Energy on this planet (Current / Max Capacity)" data-i18n-title="planet.energy_tooltip">
            <img class="planet-stat-icon" src="./assets/ui/icon-energy.svg" alt="" draggable="false" />
            <div class="planet-stat-info">
              <span class="planet-stat-value">
                <span id="val-energy-curr" class="planet-stat-curr">0</span><span class="planet-stat-sep">/</span><span id="val-energy-max" class="planet-stat-max">0</span>
              </span>
              <span class="planet-stat-meter" aria-hidden="true">
                <span id="meter-energy-fill" class="planet-stat-meter-fill"></span>
              </span>
            </div>
          </div>

          <span class="planet-tray-divider" aria-hidden="true"></span>

          <div id="planet-stat-bricks" class="planet-stat-cell planet-stat-cell--bricks is-empty" title="Construction Bricks on this planet (Obtained by Mines)" data-i18n-title="planet.bricks_tooltip">
            <img class="planet-stat-icon" src="./assets/ui/icon-bricks.svg" alt="" draggable="false" />
            <div class="planet-stat-info">
              <span class="planet-stat-value">
                <span id="val-bricks" class="planet-stat-curr">0</span>
              </span>
              <span id="rate-bricks" class="planet-stat-rate"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Global Toast / Error Banner -->
  <div id="game-toast-container" class="game-toast-container" aria-live="assertive" aria-atomic="true"></div>

  <!-- Floating World-Anchored Tile Action Button (Research Center) -->
  <button id="btn-tile-research-tree" class="tile-action-btn tile-action-btn--research is-hidden" type="button" aria-label="Open Research Tree" data-i18n-aria-label="aria.open_research_tree">
    <img class="tile-action-icon" src="./assets/ui/icon-research.svg" alt="" draggable="false" />
    <span class="tile-action-label" data-i18n="research.open_tree">Research Tree</span>
  </button>

  <!-- Planet navigation -->
  <button id="btn-prev-planet" class="planet-nav planet-nav-prev is-hidden" type="button" aria-label="Previous Planet" data-i18n-aria-label="aria.prev_planet">
    <img class="nav-arrow-icon nav-arrow-icon--flip" src="./assets/ui/icon-arrow.svg" alt="" draggable="false" />
  </button>
  <button id="btn-next-planet" class="planet-nav planet-nav-next" type="button" aria-label="Next Planet" data-i18n-aria-label="aria.next_planet">
    <img class="nav-arrow-icon" src="./assets/ui/icon-arrow.svg" alt="" draggable="false" />
  </button>

  <nav id="planet-dots" class="planet-dots" aria-label="Planet Selection" data-i18n-aria-label="aria.planet_selection">
    <button type="button" class="planet-dot active" data-index="0" aria-label="Planet 1" data-i18n-aria-label="planets.planet_1.default_name" aria-current="true"></button>
    <button type="button" class="planet-dot" data-index="1" aria-label="Planet 2" data-i18n-aria-label="planets.planet_2.default_name"></button>
    <button type="button" class="planet-dot" data-index="2" aria-label="Planet 3" data-i18n-aria-label="planets.planet_3.default_name"></button>
  </nav>

  <!-- Zoom -->
  <div id="view-controls" class="view-controls" aria-label="View Controls" data-i18n-aria-label="aria.view_controls">
    <button id="btn-zoom-out" class="zoom-btn" type="button" aria-label="Zoom Out" data-i18n-aria-label="aria.zoom_out" disabled>
      <img class="zoom-icon" src="./assets/ui/icon-minus.svg" alt="" draggable="false" />
    </button>
    <span id="zoom-level-label" class="zoom-value">1.0×</span>
    <button id="btn-zoom-in" class="zoom-btn" type="button" aria-label="Zoom In" data-i18n-aria-label="aria.zoom_in">
      <img class="zoom-icon" src="./assets/ui/icon-plus.svg" alt="" draggable="false" />
    </button>
  </div>

  <!-- Build menu -->
  <aside id="build-drawer" class="build-drawer" aria-label="Building Menu" data-i18n-aria-label="aria.building_menu" aria-hidden="true">
    <div class="build-drawer-header">
      <div class="build-title-stack">
        <span id="build-biome-badge" class="build-biome-badge">
          <img id="build-biome-icon" class="build-biome-icon" src="./assets/ui/biome-mountains.svg" alt="" draggable="false" />
        </span>
        <h2 id="build-tile-title" class="build-title" data-i18n="biomes.mountains.name">Mountains</h2>
      </div>

      <div id="build-categories" class="build-categories" role="tablist" aria-label="Building Categories" data-i18n-aria-label="aria.building_categories"></div>

      <div class="build-header-actions">
        <button id="btn-remove-building" class="build-remove-btn is-hidden" type="button" aria-label="Demolish Building" data-i18n-aria-label="aria.demolish_building">
          <img class="btn-icon-sm" src="./assets/ui/icon-trash.svg" alt="" draggable="false" />
          <span class="build-remove-label" data-i18n="build.demolish">Demolish</span>
        </button>
        <button id="btn-close-build" class="build-close-btn" type="button" aria-label="Close Building Menu" data-i18n-aria-label="aria.close_building_menu">
          <img class="btn-icon-md" src="./assets/ui/icon-close.svg" alt="" draggable="false" />
        </button>
      </div>
    </div>

    <div id="build-unbuildable-banner" class="build-unbuildable-banner is-hidden" role="status"></div>

    <div class="build-shelf-wrap">
      <button id="btn-shelf-prev" class="build-shelf-nav build-shelf-nav--prev is-hidden" type="button" aria-label="Scroll Buildings Left" data-i18n-aria-label="aria.scroll_buildings_left">
        <img class="shelf-nav-icon shelf-nav-icon--flip" src="./assets/ui/icon-arrow.svg" alt="" draggable="false" />
      </button>
      <div id="build-list" class="build-list" role="region" aria-label="Available Buildings" data-i18n-aria-label="aria.available_buildings"></div>
      <button id="btn-shelf-next" class="build-shelf-nav build-shelf-nav--next is-hidden" type="button" aria-label="Scroll Buildings Right" data-i18n-aria-label="aria.scroll_buildings_right">
        <img class="shelf-nav-icon" src="./assets/ui/icon-arrow.svg" alt="" draggable="false" />
      </button>
    </div>

    <div id="build-confirm-scene" class="build-confirm-scene is-hidden" role="region" aria-label="Confirm Building Construction" data-i18n-aria-label="aria.confirm_building_construction" aria-hidden="true">
      <div class="build-confirm-card">
        <div class="build-confirm-main">
          <div id="build-confirm-stage" class="build-confirm-stage">
            <span id="build-confirm-cat-badge" class="build-card-cat-badge">
              <img id="build-confirm-cat-icon" class="build-card-cat-icon" src="./assets/ui/cat-all.svg" alt="" draggable="false" />
            </span>
            <span class="build-confirm-preview">
              <img id="build-confirm-icon" class="build-confirm-icon" src="./assets/ui/bld-mine.svg" alt="" draggable="false" />
            </span>
          </div>

          <div class="build-confirm-details">
            <div class="build-confirm-head">
              <h3 id="build-confirm-name" class="build-confirm-name" data-i18n="buildings.mine.name">Mine</h3>
              <div id="build-confirm-badges" class="build-confirm-badges"></div>
            </div>
            <p id="build-confirm-desc" class="build-confirm-desc"></p>
            <div id="build-confirm-replace" class="build-confirm-replace is-hidden"></div>
          </div>
        </div>

        <div class="build-confirm-actions">
          <button id="btn-confirm-cancel" class="build-confirm-btn build-confirm-btn--cancel" type="button" aria-label="Cancel Construction" data-i18n-aria-label="aria.cancel_construction">
            <img class="btn-icon-sm" src="./assets/ui/icon-close.svg" alt="" draggable="false" />
            <span class="build-confirm-btn-label" data-i18n="build.cancel">Cancel</span>
          </button>
          <button id="btn-confirm-build" class="build-confirm-btn build-confirm-btn--confirm" type="button" aria-label="Confirm Construction" data-i18n-aria-label="aria.confirm_construction">
            <span class="build-confirm-btn-label" data-i18n="build.confirm_build">Confirm Build</span>
            <span id="build-confirm-costs" class="build-confirm-costs"></span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Research Tree Modal -->
  <div id="research-modal" class="research-modal is-hidden" role="dialog" aria-modal="true" aria-label="Research Tree" data-i18n-aria-label="aria.research_tree_modal" aria-hidden="true">
    <div class="research-modal-backdrop"></div>
    <div class="research-modal-panel">
      <div class="research-modal-header">
        <div class="research-title-stack">
          <span class="research-header-badge">
            <img class="research-header-icon" src="./assets/ui/icon-research.svg" alt="" draggable="false" />
          </span>
          <div class="research-title-meta">
            <h2 class="research-modal-title" data-i18n="research.title">Research Tree</h2>
            <div id="research-terminal-pill" class="research-terminal-pill"></div>
          </div>
        </div>

        <div class="research-header-right">
          <div id="research-rp-bar" class="research-rp-bar">
            <img class="research-rp-icon" src="./assets/ui/icon-research.svg" alt="" draggable="false" />
            <div class="research-rp-stats">
              <span class="research-rp-val-row">
                <span id="val-research-points" class="research-rp-val">0</span>
                <span class="research-rp-unit" data-i18n="research.rp_unit">RP</span>
              </span>
              <span id="rate-research-points" class="research-rp-rate"></span>
            </div>
          </div>
          <button id="btn-close-research" class="build-close-btn" type="button" aria-label="Close Research Tree" data-i18n-aria-label="aria.close_research_tree">
            <img class="btn-icon-md" src="./assets/ui/icon-close.svg" alt="" draggable="false" />
          </button>
        </div>
      </div>

      <div id="research-categories" class="research-categories" role="tablist"></div>
      <div id="research-tree-body" class="research-tree-body"></div>
      <div id="research-detail-panel" class="research-detail-panel is-hidden" aria-live="polite"></div>
    </div>
  </div>

  <script src="./lang/en_us.js"></script>
  <script src="./js/main.js"></script>
  <script src="./js/currencies.js"></script>
  <script src="./js/research.js"></script>
  <script src="./js/buildings.js"></script>
  <script src="./js/planets.js"></script>
</body>
</html>
