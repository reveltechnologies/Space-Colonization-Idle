<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#060913" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Space Colonization: Idle — Mobile sci-fi incremental colony builder." />
  <title>Space Colonization: Idle</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Animated Space Background -->
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- Planet Carousel Stage -->
  <canvas id="planet-stage" aria-label="Planet Carousel"></canvas>

  <!-- Translucent Edge Navigation Arrows -->
  <button id="btn-prev-planet" class="planet-nav planet-nav-prev is-hidden" type="button" aria-label="Previous Planet">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button id="btn-next-planet" class="planet-nav planet-nav-next" type="button" aria-label="Next Planet">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>

  <!-- Planet Position Indicator Dots -->
  <nav id="planet-dots" class="planet-dots" aria-label="Planet Selection">
    <button type="button" class="planet-dot active" data-index="0" aria-label="Planet 1" aria-current="true"></button>
    <button type="button" class="planet-dot" data-index="1" aria-label="Planet 2"></button>
    <button type="button" class="planet-dot" data-index="2" aria-label="Planet 3"></button>
  </nav>

  <!-- Bottom-Right Zoom & Reset View Controls -->
  <div id="view-controls" class="view-controls" aria-label="View Controls">
    <button id="btn-reset-view" class="view-btn is-hidden" type="button" aria-label="Reset View">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
        <polyline points="3 3 3 8 8 8"></polyline>
      </svg>
    </button>
    <button id="btn-zoom-out" class="view-btn" type="button" aria-label="Zoom Out" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
    <button id="btn-zoom-in" class="view-btn" type="button" aria-label="Zoom In">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </div>

  <script src="./js/main.js"></script>
  <script src="./js/planets.js"></script>
</body>
</html>
