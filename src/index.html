<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#060913" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Space Colonization: Idle — Mobile sci-fi incremental colony builder." />
  <title>Space Colonization: Idle</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <canvas id="planet-stage" aria-label="Planet Carousel"></canvas>

  <!-- Currencies -->
  <header id="currency-hud" class="currency-hud" aria-label="Colony Currencies">
    <div id="currency-credits" class="currency-bar currency-bar--credits" title="Credits">
      <img class="currency-badge" src="./assets/ui/icon-credits.svg" alt="" draggable="false" />
      <span id="val-credits" class="currency-value">500</span>
      <span id="rate-credits" class="currency-rate"></span>
    </div>
    <div id="currency-ore" class="currency-bar currency-bar--ore" title="Space Ore">
      <img class="currency-badge" src="./assets/ui/icon-ore.svg" alt="" draggable="false" />
      <span id="val-ore" class="currency-value">100</span>
      <span id="rate-ore" class="currency-rate"></span>
    </div>
  </header>

  <!-- Planet navigation -->
  <button id="btn-prev-planet" class="planet-nav planet-nav-prev is-hidden" type="button" aria-label="Previous Planet">
    <img class="nav-arrow-icon nav-arrow-icon--flip" src="./assets/ui/icon-arrow.svg" alt="" draggable="false" />
  </button>
  <button id="btn-next-planet" class="planet-nav planet-nav-next" type="button" aria-label="Next Planet">
    <img class="nav-arrow-icon" src="./assets/ui/icon-arrow.svg" alt="" draggable="false" />
  </button>

  <nav id="planet-dots" class="planet-dots" aria-label="Planet Selection">
    <button type="button" class="planet-dot active" data-index="0" aria-label="Planet 1" aria-current="true"></button>
    <button type="button" class="planet-dot" data-index="1" aria-label="Planet 2"></button>
    <button type="button" class="planet-dot" data-index="2" aria-label="Planet 3"></button>
  </nav>

  <!-- Zoom -->
  <div id="view-controls" class="view-controls" aria-label="View Controls">
    <button id="btn-zoom-out" class="zoom-btn" type="button" aria-label="Zoom Out" disabled>
      <img class="zoom-icon" src="./assets/ui/icon-minus.svg" alt="" draggable="false" />
    </button>
    <span id="zoom-level-label" class="zoom-value">1.0×</span>
    <button id="btn-zoom-in" class="zoom-btn" type="button" aria-label="Zoom In">
      <img class="zoom-icon" src="./assets/ui/icon-plus.svg" alt="" draggable="false" />
    </button>
  </div>

  <!-- Build menu -->
  <aside id="build-drawer" class="build-drawer" aria-label="Building Menu" aria-hidden="true">
    <div class="build-drawer-header">
      <div class="build-title-stack">
        <span id="build-biome-badge" class="build-biome-badge">
          <img id="build-biome-icon" class="build-biome-icon" src="./assets/ui/biome-mountains.svg" alt="" draggable="false" />
        </span>
        <h2 id="build-tile-title" class="build-title">Mountains</h2>
      </div>
      <div class="build-header-actions">
        <button id="btn-remove-building" class="build-remove-btn is-hidden" type="button" aria-label="Remove Building">
          <img class="btn-icon-sm" src="./assets/ui/icon-trash.svg" alt="" draggable="false" />
        </button>
        <button id="btn-close-build" class="build-close-btn" type="button" aria-label="Close Building Menu">
          <img class="btn-icon-md" src="./assets/ui/icon-close.svg" alt="" draggable="false" />
        </button>
      </div>
    </div>

    <div id="build-categories" class="build-categories" role="tablist" aria-label="Building Categories"></div>
    <div id="build-list" class="build-list" role="region" aria-label="Available Buildings"></div>
  </aside>

  <script src="./js/main.js"></script>
  <script src="./js/currencies.js"></script>
  <script src="./js/buildings.js"></script>
  <script src="./js/planets.js"></script>
</body>
</html>
